name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  test:
    uses: ./.github/workflows/tests.yml

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Acepta los archivos sueltos en la raíz del repo y los acomoda en lib/.
      - name: Arrange files
        run: |
          mkdir -p lib/screens lib/services lib/widgets
          move() { if [ -f "$1" ]; then mv "$1" "$2/"; fi; }
          for f in admin_screen auth_screen banned_screen chats_screen create_screen feed_screen group_detail_screen groups_screen help_screen home_shell profile_screen post_screen profile_setup_screen reels_screen search_screen settings_screen; do move "$f.dart" lib/screens; done
          move db.dart lib/services
          for f in comments_sheet feedback_prompt photo_editor poll_block post_card reactions report_dialog user_avatar; do move "$f.dart" lib/widgets; done
          for f in main config net notifier notify_stub notify_web safety theme util; do move "$f.dart" lib; done
          test -f lib/main.dart || { echo "Falta main.dart"; exit 1; }
          test -f pubspec.yaml || { echo "Falta pubspec.yaml"; exit 1; }

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # El repo solo guarda lib/ y pubspec.yaml; la carpeta android/ se genera aquí.
      - name: Generate Android project
        run: |
          cp -r lib "$RUNNER_TEMP/lib_bak"
          cp pubspec.yaml "$RUNNER_TEMP/pubspec_bak.yaml"
          flutter create --platforms=android --org com.gamingsocial --project-name gamingsocial .
          rm -rf lib test
          cp -r "$RUNNER_TEMP/lib_bak" lib
          cp "$RUNNER_TEMP/pubspec_bak.yaml" pubspec.yaml

      - name: Configure Android (minSdk, internet, app name, lint)
        run: |
          for f in android/app/build.gradle android/app/build.gradle.kts; do
            if [ -f "$f" ]; then
              sed -i -E 's/minSdk(Version)?[ ]*=[ ]*flutter\.minSdkVersion/minSdk = 23/; s/minSdkVersion[ ]+flutter\.minSdkVersion/minSdkVersion 23/' "$f"
              sed -i '0,/^android {/s//android {\n    lint {\n        checkReleaseBuilds = false\n        abortOnError = false\n    }/' "$f"
            fi
          done
          # Necesario para las notificaciones locales.
          if [ -f android/app/build.gradle.kts ]; then
            sed -i 's/compileOptions {/compileOptions {\n        isCoreLibraryDesugaringEnabled = true/' android/app/build.gradle.kts
            printf '\ndependencies {\n    coreLibraryDesugaring("com.android.tools:desugar_jdk_libs:2.1.4")\n}\n' >> android/app/build.gradle.kts
          elif [ -f android/app/build.gradle ]; then
            sed -i 's/compileOptions {/compileOptions {\n        coreLibraryDesugaringEnabled true/' android/app/build.gradle
            printf "\ndependencies {\n    coreLibraryDesugaring 'com.android.tools:desugar_jdk_libs:2.1.4'\n}\n" >> android/app/build.gradle
          fi
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <uses-permission android:name="android.permission.POST_NOTIFICATIONS"/>\n    <application#' "$M"
          sed -i 's#android:label="[^"]*"#android:label="GamingSocial"#' "$M"

      - run: flutter pub get

      # Ícono de la app: usa app_icon.png (en la raíz del repo) si existe.
      - name: App icon
        run: |
          if [ -f app_icon.png ]; then
            flutter pub add --dev flutter_launcher_icons
            printf 'flutter_launcher_icons:\n  android: true\n  ios: false\n  image_path: "app_icon.png"\n  min_sdk_android: 23\n' > flutter_launcher_icons.yaml
            dart run flutter_launcher_icons
          else
            echo "No hay app_icon.png, se usa el ícono por defecto"
          fi

      # Firma fija: así cada versión nueva se instala encima de la anterior.
      - name: Use fixed signing key
        env:
          KS: ${{ secrets.ANDROID_KEYSTORE_B64 }}
        run: |
          if [ -n "$KS" ]; then
            mkdir -p ~/.android
            echo "$KS" | base64 -d > ~/.android/debug.keystore
            echo "Firma fija activada"
          else
            echo "::warning::Falta el secreto ANDROID_KEYSTORE_B64: la firma cambia en cada compilación y no se podrá actualizar sin desinstalar."
          fi

      - name: Build release APK
        run: flutter build apk --release --dart-define=APP_VERSION=${{ github.sha }}

      - uses: actions/upload-artifact@v4
        with:
          name: GamingSocial-apk
          path: build/app/outputs/flutter-apk/app-release.apk

      # Enlace de descarga directo (más fácil que el zip de Artifacts).
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp build/app/outputs/flutter-apk/app-release.apk GamingSocial.apk
          gh release delete apk-latest --yes --cleanup-tag || true
          gh release create apk-latest GamingSocial.apk --title "GamingSocial (APK más reciente)" --notes "Descarga GamingSocial.apk e instálala. version:${{ github.sha }}"
