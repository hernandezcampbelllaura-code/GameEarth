name: Build APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Acepta los archivos sueltos en la raíz del repo y los acomoda en lib/.
      - name: Arrange files
        run: |
          mkdir -p lib/screens lib/services lib/widgets
          move() { if [ -f "$1" ]; then mv "$1" "$2/"; fi; }
          for f in admin_screen auth_screen banned_screen create_screen feed_screen home_shell profile_screen profile_setup_screen search_screen; do move "$f.dart" lib/screens; done
          move db.dart lib/services
          for f in comments_sheet post_card report_dialog user_avatar; do move "$f.dart" lib/widgets; done
          for f in main firebase_options theme util; do move "$f.dart" lib; done
          test -f lib/main.dart || { echo "Falta main.dart"; exit 1; }
          test -f pubspec.yaml || { echo "Falta pubspec.yaml"; exit 1; }

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # El repo solo guarda lib/ y pubspec.yaml; la carpeta android/ se genera aquí.
      - name: Generate Android project
        run: |
          cp -r lib "$RUNNER_TEMP/lib_bak"
          cp pubspec.yaml "$RUNNER_TEMP/pubspec_bak.yaml"
          flutter create --platforms=android --org com.gamingsocial --project-name gamingsocial .
          rm -rf lib test
          cp -r "$RUNNER_TEMP/lib_bak" lib
          cp "$RUNNER_TEMP/pubspec_bak.yaml" pubspec.yaml

      - name: Configure Android (minSdk, internet, app name)
        run: |
          for f in android/app/build.gradle android/app/build.gradle.kts; do
            if [ -f "$f" ]; then
              sed -i -E 's/minSdk(Version)?[ ]*=[ ]*flutter\.minSdkVersion/minSdk = 23/; s/minSdkVersion[ ]+flutter\.minSdkVersion/minSdkVersion 23/' "$f"
            fi
          done
          M=android/app/src/main/AndroidManifest.xml
          sed -i 's#<application#<uses-permission android:name="android.permission.INTERNET"/>\n    <application#' "$M"
          sed -i 's#android:label="[^"]*"#android:label="GamingSocial"#' "$M"

      - run: flutter pub get

      - name: Build release APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: GamingSocial-apk
          path: build/app/outputs/flutter-apk/app-release.apk
